[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlp-to-bash"
version = "0.1.0"
description = "A small PyQt6 application for turning natural-language prompts into shell commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "ollama>=0.1.0",
]

[project.scripts]
pyqt6-app-trial = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]